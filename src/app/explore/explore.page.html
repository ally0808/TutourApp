
  <!-- Encabezado -->
  <header class="header-container">
    <h1 class="title-explore">Explorar</h1>
  </header>

  <!-- Buscador -->
  <section class="search-wrapper">
    <div class="search-bar">
      <img
        src="assets/icon/buscar.png"
        alt="Buscar"
        class="search-icon"
      />

      <input
        type="search"
        placeholder="Buscar lugares servicios o experiencias"
        class="search-input"
        [(ngModel)]="busqueda"
        aria-label="Buscar establecimientos"
      />
    </div>
  </section>

  <!-- Carrusel de categorías -->
  <section
    class="carousel-container"
    #categoryCarousel
    aria-label="Categorías turísticas"
    (touchstart)="pauseCarousel()"
    (touchend)="resumeCarouselDelay()"
    (touchcancel)="resumeCarouselDelay()"
    (mousedown)="pauseCarousel()"
    (mouseup)="resumeCarouselDelay()"
    (mouseleave)="resumeCarouselDelay()"
  >
    <button
      type="button"
      class="category-btn"
      *ngFor="let cat of categories"
      [style.backgroundColor]="cat.color"
      [class.category-selected]="categoriaSeleccionada === cat.name"
      [attr.aria-pressed]="categoriaSeleccionada === cat.name"
      (click)="seleccionarCategoria(cat.name)"
    >
      {{ cat.name }}
    </button>
  </section>

  <!-- Selector Lista / Mapa -->
  <section class="toggle-wrapper">
    <div class="toggle-container">
      <button
        type="button"
        class="toggle-btn"
        [class.active]="vistaActual === 'lista'"
        [class.inactive]="vistaActual !== 'lista'"
        (click)="cambiarVista('lista')"
      >
        Lista
      </button>

      <button
        type="button"
        class="toggle-btn"
        [class.active]="vistaActual === 'mapa'"
        [class.inactive]="vistaActual !== 'mapa'"
        (click)="cambiarVista('mapa')"
      >
        Mapa
      </button>
    </div>
  </section>

  <!-- Vista de lista -->
  <section class="places-list" *ngIf="vistaActual === 'lista'">

    <article
      class="place-card"
      *ngFor="let place of lugaresFiltrados"
    >
      <!-- Fotografía -->
      <button
        type="button"
        class="card-image-container"
        (click)="ampliarImagen(place.image, place.name)"
        [attr.aria-label]="'Ampliar fotografía de ' + place.name"
      >
        <img
          [src]="place.image"
          [alt]="place.name"
          class="place-img"
          loading="lazy"
        />
      </button>

      <!-- Información -->
      <div class="card-info">

        <div class="card-header">
          <h2 class="place-title">{{ place.name }}</h2>

          <button
            type="button"
            class="favorite-button"
            [class.favorite-active]="esFavorito(place.id)"
            (click)="alternarFavorito(place.id)"
            [attr.aria-label]="esFavorito(place.id)
              ? 'Quitar de favoritos'
              : 'Agregar a favoritos'"
            [attr.aria-pressed]="esFavorito(place.id)"
          >
            <img
              src="assets/icon/favoritos.png"
              alt=""
              class="heart-icon"
            />
          </button>
        </div>

        <span
          class="badge-category"
          [style.backgroundColor]="place.color"
        >
          {{ place.category }}
        </span>

        <div class="rating-row">
          <img
            src="assets/icon/estrella.png
