<ion-content class="config-page" [fullscreen]="true">
  <main class="config-container">
    <header class="config-header">
      <button type="button" class="back-btn" id="config-back-btn" aria-label="Volver" routerLink="/home">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="config-title">Ayuda e<br />Información</h1>
    </header>

    <nav class="config-menu" aria-label="Opciones de ayuda e información">
      <button type="button" class="menu-item" id="config-uso" routerLink="/uso-tutour">
        <span class="menu-icon icon-orange"><ion-icon name="help-outline"></ion-icon></span>
        <span class="menu-label">Uso de Tutour</span>
        <ion-icon class="menu-chevron" name="chevron-forward-outline"></ion-icon>
      </button>

      <button type="button" class="menu-item" id="config-nosotros" routerLink="/sobre-nosotros">
        <span class="menu-icon icon-green"><ion-icon name="information-outline"></ion-icon></span>
        <span class="menu-label">Sobre nosotros</span>
        <ion-icon class="menu-chevron" name="chevron-forward-outline"></ion-icon>
      </button>

      <button type="button" class="menu-item" id="config-idioma" routerLink="/idioma">
        <span class="menu-icon icon-blue"><ion-icon name="globe-outline"></ion-icon></span>
        <span class="menu-label">Idioma</span>
        <ion-icon class="menu-chevron" name="chevron-forward-outline"></ion-icon>
      </button>

      <button type="button" class="menu-item" id="config-privacidad" routerLink="/privacidad">
        <span class="menu-icon icon-purple"><ion-icon name="lock-closed-outline"></ion-icon></span>
        <span class="menu-label">Privacidad</span>
        <ion-icon class="menu-chevron" name="chevron-forward-outline"></ion-icon>
      </button>

      <button type="button" class="menu-item" id="config-contacto" routerLink="/contacto">
        <span class="menu-icon icon-yellow"><ion-icon name="call-outline"></ion-icon></span>
        <span class="menu-label">Contacto/Soporte</span>
        <ion-icon class="menu-chevron" name="chevron-forward-outline"></ion-icon>
      </button>
    </nav>
  </main>
</ion-content>

<ion-footer class="config-footer">
  <nav class="bottom-nav">
    <button type="button" class="nav-item" routerLink="/home">
      <ion-icon name="home-outline" class="nav-icon"></ion-icon>
      <span>Inicio</span>
    </button>

    <!-- Cambiado /explorar por /explore -->
    <button type="button" class="nav-item" routerLink="/explore">
      <ion-icon name="search-outline" class="nav-icon"></ion-icon>
      <span>Explorar</span>
    </button>

    <!-- Cambiado /favoritos por /favorites -->
    <button type="button" class="nav-item" routerLink="/favorites">
      <ion-icon name="heart-outline" class="nav-icon"></ion-icon>
      <span>Favoritos</span>
    </button>

    <button type="button" class="nav-item nav-active" routerLink="/configuracion">
      <ion-icon name="settings-outline" class="nav-icon"></ion-icon>
      <span>Configuración</span>
    </button>
  </nav>
</ion-footer>
