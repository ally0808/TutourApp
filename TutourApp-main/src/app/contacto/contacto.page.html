<ion-content class="contacto-page" [fullscreen]="true">
  <div class="contacto-container">
    <header class="contacto-header">
      <button type="button" class="back-btn" id="contacto-back-btn" routerLink="/configuracion" aria-label="Regresar">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="contacto-title">Contacto/Soporte</h1>
    </header>

    <section class="contacto-hero" id="contacto-hero">
       <img class="hero-img" src="assets/images/museo-calvillo.png" alt="Museo de Calvillo" />
      <div class="hero-overlay">
        <h2>¿Necesitas ayuda?</h2>
        <p>
          Estamos para ayudarte. Si tienes dudas, comentarios o necesitas reportar algún problema
          con la aplicación, puedes ponerte en contacto con el equipo de Tutour.
        </p>
      </div>
    </section>

    <section class="contacto-card">
      <article class="contact-item" id="contacto-correo">
        <div class="contact-icon">
          <ion-icon name="mail-outline"></ion-icon>
        </div>
        <div class="contact-text">
          <h3>Correo electrónico</h3>
          <p>tutour.calvillo&#64;gmail.com</p>
        </div>
      </article>

      <article class="contact-item" id="contacto-telefono">
        <div class="contact-icon">
          <ion-icon name="call-outline"></ion-icon>
        </div>
        <div class="contact-text">
          <h3>Teléfono</h3>
          <p>(495) 958 0923</p>
        </div>
      </article>

      <div class="social-row">
        <button type="button" class="social-btn" id="contacto-facebook" aria-label="Facebook">
          <ion-icon name="logo-facebook"></ion-icon>
        </button>
        <button type="button" class="social-btn" id="contacto-instagram" aria-label="Instagram">
          <ion-icon name="logo-instagram"></ion-icon>
        </button>
        <button type="button" class="social-btn" id="contacto-tiktok" aria-label="TikTok">
          <ion-icon name="logo-tiktok"></ion-icon>
        </button>
      </div>

      <p class="contacto-footer-text">¡Estamos para ayudarte!</p>
    </section>
  </div>
</ion-content>

<ion-footer class="contacto-footer">
  <nav class="tab-bar">
    <button type="button" class="tab-item" id="tab-inicio" routerLink="/home">
      <ion-icon name="home"></ion-icon>
      <span>Inicio</span>
    </button>
    <button type="button" class="tab-item" id="tab-explorar" routerLink="/explore">
      <ion-icon name="search-outline"></ion-icon>
      <span>Explorar</span>
    </button>
    <button type="button" class="tab-item" id="tab-favoritos" routerLink="/favorites">
      <ion-icon name="heart-outline"></ion-icon>
      <span>Favoritos</span>
    </button>
    <button type="button" class="tab-item active" id="tab-configuracion" routerLink="/configuracion">
      <ion-icon name="settings-outline"></ion-icon>
      <span>Configuración</span>
    </button>
  </nav>
</ion-footer>
