<ion-content class="idioma-page" [fullscreen]="true">
  <div class="idioma-container">

    <!-- Encabezado con botón de regresar -->
    <header class="idioma-header">
      <button type="button" class="back-btn" routerLink="/configuracion">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="idioma-title">{{ 'IDIOMA' | translate }}</h1>
    </header>

    <!-- Tarjeta Principal de Idiomas -->
    <div class="idioma-card">
      
      <div class="card-head">
        <div class="globe-icon">
          <ion-icon name="globe-outline"></ion-icon>
        </div>
        <h2 class="card-title">{{ 'SELECCIONA_IDIOMA' | translate }}</h2>
      </div>

      <ul class="lang-list">
        <!-- Español -->
        <li class="lang-item" (click)="seleccionarIdioma('es')">
          <img src="assets/icon/es.png" alt="Español" class="flag-img" />
          <span class="lang-name">{{ 'ESPANOL' | translate }}</span>
          <div class="radio" [class.checked]="idiomaSeleccionado === 'es'"></div>
        </li>

        <!-- Inglés -->
        <li class="lang-item" (click)="seleccionarIdioma('en')">
          <img src="assets/icon/en.png" alt="Inglés" class="flag-img" />
          <span class="lang-name">{{ 'INGLES' | translate }}</span>
          <div class="radio" [class.checked]="idiomaSeleccionado === 'en'"></div>
        </li>

        <!-- Francés -->
        <li class="lang-item" (click)="seleccionarIdioma('fr')">
          <img src="assets/icon/fr.png" alt="Francés" class="flag-img" />
          <span class="lang-name">{{ 'FRANCES' | translate }}</span>
          <div class="radio" [class.checked]="idiomaSeleccionado === 'fr'"></div>
        </li>

        <!-- Portugués -->
        <li class="lang-item" (click)="seleccionarIdioma('pt')">
          <img src="assets/icon/pt.png" alt="Portugués" class="flag-img" />
          <span class="lang-name">{{ 'PORTUGUES' | translate }}</span>
          <div class="radio" [class.checked]="idiomaSeleccionado === 'pt'"></div>
        </li>

        <!-- Japonés -->
        <li class="lang-item" (click)="seleccionarIdioma('ja')">
          <img src="assets/icon/ja.png" alt="Japonés" class="flag-img" />
          <span class="lang-name">{{ 'JAPONES' | translate }}</span>
          <div class="radio" [class.checked]="idiomaSeleccionado === 'ja'"></div>
        </li>
      </ul>

    </div>

    <!-- Mensaje informativo inferior -->
    <button type="button" class="info-btn">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>{{ 'OTROS_IDIOMAS_PRONTO' | translate }}</span>
    </button>

  </div>
</ion-content>

<!-- Menú Inferior Unificado -->
<ion-footer class="idioma-footer">
  <nav class="bottom-nav">
    <button type="button" class="nav-item" routerLink="/home">
      <ion-icon name="home-outline" class="nav-icon"></ion-icon>
      <span>{{ 'Inicio' | translate }}</span>
    </button>

    <button type="button" class="nav-item" routerLink="/explore">
      <ion-icon name="search-outline" class="nav-icon"></ion-icon>
      <span>{{ 'Explorar' | translate }}</span>
    </button>

    <button type="button" class="nav-item" routerLink="/favorites">
      <ion-icon name="heart-outline" class="nav-icon"></ion-icon>
      <span>{{ 'Favoritos' | translate }}</span>
    </button>

    <button type="button" class="nav-item nav-active" routerLink="/configuracion">
      <ion-icon name="settings-outline" class="nav-icon"></ion-icon>
      <span>{{ 'Configuración' | translate }}</span>
    </button>
  </nav>
</ion-footer>
