<ion-content class="idioma-page" [fullscreen]="true">
  <div class="idioma-container">
    <header class="idioma-header">
      <button type="button" class="back-btn" id="idioma-back-btn" routerLink="/configuracion" aria-label="Regresar">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1 class="idioma-title">Idioma</h1>
    </header>

    <section class="idioma-card">
      <div class="card-head">
        <div class="globe-icon">
          <ion-icon name="globe-outline"></ion-icon>
        </div>
        <h2 class="card-title">Selecciona el idioma de la aplicación</h2>
      </div>

      <ul class="lang-list">
        <li class="lang-item selected" id="idioma-es">
          <span class="flag flag-es"></span>
          <span class="lang-name">Español</span>
          <span class="radio checked"></span>
        </li>
        <li class="lang-item" id="idioma-en">
          <span class="flag flag-en"></span>
          <span class="lang-name">Inglés</span>
          <span class="radio"></span>
        </li>
        <li class="lang-item" id="idioma-fr">
          <span class="flag flag-fr"></span>
          <span class="lang-name">Francés</span>
          <span class="radio"></span>
        </li>
        <li class="lang-item" id="idioma-pt">
          <span class="flag flag-pt"></span>
          <span class="lang-name">Portugues</span>
          <span class="radio"></span>
        </li>
        <li class="lang-item" id="idioma-ja">
          <span class="flag flag-ja"></span>
          <span class="lang-name">Japónes</span>
          <span class="radio"></span>
        </li>
      </ul>
    </section>

    <button type="button" class="info-btn" id="idioma-info-btn" aria-label="Información">
      <ion-icon name="information-circle-outline"></ion-icon>
    </button>
  </div>
</ion-content>

<ion-footer class="idioma-footer">
  <nav class="tab-bar">
    <button type="button" class="tab-item" id="tab-inicio" routerLink="/home">
      <ion-icon name="home"></ion-icon>
      <span>Inicio</span>
    </button>
    <button type="button" class="tab-item" id="tab-explorar" routerLink="/explore">
      <ion-icon name="search-outline"></ion-icon>
      <span>Explorar</span>
    </button>
    <button type="button" class="tab-item" id="tab-favoritos" routerLink="/favorites">
      <ion-icon name="heart-outline"></ion-icon>
      <span>Favoritos</span>
    </button>
    <button type="button" class="tab-item" id="tab-configuracion" routerLink="/configuracion">
      <ion-icon name="settings-outline"></ion-icon>
      <span>Configuración</span>
    </button>
  </nav>
</ion-footer>
